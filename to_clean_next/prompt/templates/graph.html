<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DeltaGraph - $CHAIN_ID</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css" rel="stylesheet">
<style>
body{font-family:-apple-system,sans-serif;margin:0;padding:10px;background:#fafafa}
#graph{height:90vh;border:1px solid #ddd;background:white}
.header{margin-bottom:8px;color:#666;font-size:13px}
</style>
</head>
<body>
<div class="header">DeltaGraph: $CHAIN_ID — $NODES nodos, $EDGES edges</div>
<div id="graph"></div>
<script>
var nodes = new vis.DataSet($NODES_JSON);
var edges = new vis.DataSet($EDGES_JSON);
var container = document.getElementById('graph');
var data = {nodes: nodes, edges: edges};
var options = {
  nodes: {size: 15, font: {size: 10}},
  edges: {arrows: 'to', font: {size: 8, align: 'middle'}},
  layout: {improvedLayout: true},
  physics: {barnesHut: {springLength: 150}}
};
new vis.Network(container, data, options);
</script>
</body>
</html>
