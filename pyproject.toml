[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "walker3"
version = "3.0.0"
description = "Walker3 — Pure Workflow Engine"
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "returns",
    # Comparación de constraints de plugins (hooks/módulos): ">=3.0,<4".
    "packaging",
    # Firmas ed25519 de paquetes de hooks (verificación de autoría).
    "cryptography",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-bdd",
]
dev = [
    "pytest",
    "pytest-bdd",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "contrato: escenarios que validan el contrato result pattern del CPG",
    "ssot: escenarios de Single Source of Truth (registry vs MCP)",
    "composicion: escenarios de composición monádica sin try/except",
    "excepciones: escenarios de excepción -> Failure via @safe",
    "fallback: escenarios de fallback explícito (convention-001)",
    "contexto: escenarios de gather de contexto",
    "bugs: escenarios de detección de bugs/funciones sin uso",
    "review: escenarios de review de código",
    "metrics: escenarios de métricas y quality gates",
    "regresion: escenarios de regresión de la cadena pública",
    "stdlib: escenarios de imports stdlib",
    "cache: escenarios de caches incrementales",
    "gates: escenarios de quality gates y side-effects",
    "rendimiento: escenarios de performance build vs incremental",
    "trace-side-effect: escenarios de trazabilidad de side-effects (SPEC-002 G-W1)",
    "trace-channel: escenarios de canal de invocación en task_execute (SPEC-002 G-W1)",
    "cpg-indexed: escenarios de certificación del indexado CPG (SPEC-002 G-W1)",
    "delta: escenarios de delta graph",
    "compact-search: escenarios de búsqueda compacta",
    "auto-query-gate: escenarios del auto-query gate",
    "adr: escenarios de validación de ADRs",
    "contract: escenarios de contracts y protocolo",
    "context-contracts: escenarios de contratos de contexto",
    "use_cases: escenarios de casos de uso",
    "joins: escenarios de joins",
    "analyze: escenarios de analyze",
    "refs: escenarios de referencias",
    "gate: escenarios de gates",
    "error_handler: escenarios de manejo de errores",
    "workflow: escenarios de workflow",
    "validate_plan: escenarios de validación de planes",
    "submit_orchestrator: escenarios de submit orchestrator",
    "safe: escenarios de función segura (@safe)",
    "resources: escenarios de recursos",
    "help: escenarios de help",
    "envelope: escenarios de envelope estándar",
    "discovery: escenarios de discovery",
    "catalogo: escenarios de catálogo",
    "transition: escenarios de transiciones",
    "search: escenarios de búsqueda",
    "rest: escenarios de API REST",
    "canonico: escenarios canónicos",
    "roundtrip: escenarios de roundtrip",
    "push: escenarios de push",
    "dedupe: escenarios de deduplicación",
    "carga: escenarios de carga",
]
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
]

[project.urls]
Documentation = "https://github.com/davidmartinez/walker3"

[project.scripts]
walker3 = "fast_mcp.main:main"
walker = "fast_mcp.main:main"

[tool.setuptools.packages.find]
include = ["fast_mcp*", "features*", "shared*", "core*", "orchestration*", "libs*"]
