# Semgrep rules for DRY/SSOT violations in refactored code.
rules:
  - id: DRY-duplicate-import
    patterns:
      - pattern-either:
          - pattern: "from $X import $Y"
          - pattern: "import $X"
    severity: WARNING
    message: "Potential DRY violation: consider consolidating duplicate imports"

  - id: SSOT-hardcoded-business-rule
    patterns:
      - pattern-either:
          - pattern: "if $X == \"$Y\" or $X == \"$Z\":"
          - pattern: "if $X in frozenset({...})"
    severity: WARNING
    message: "SSOT violation: business rules hardcoded instead of in domain model. Move to models.py or config."

  - id: DRY-repeated-string-literal
    patterns:
      - pattern-either:
          - pattern: '"$VAL"'
          - pattern: "'$VAL'"
    severity: INFO
    message: "Repeated string literal — consider extracting to constant if used in multiple places"

  - id: SSOT-magic-number
    patterns:
      - pattern-either:
          - pattern: "if $X > 120:"
          - pattern: "if $X <= 120:"
          - pattern: "if time.time() - $X <= 120:"
          - pattern: "time.time() - $X <= 120"
    severity: WARNING
    message: "SSOT violation: magic number (120) — extract to named constant, e.g. GPS_INSTRUCTION_TTL"

  - id: DRY-duplicate-try-except
    patterns:
      - pattern: |
          try:
            ...
          except Exception:
            pass
    severity: INFO
    message: "DRY violation: repeated bare 'except: pass' pattern — consider a helper or decorator"

  - id: SSOT-duplicate-logic
    patterns:
      - pattern-either:
          - pattern: "from cognitive_v2.shared.messages.application.message_service import MessageService"
          - pattern: "from cognitive_v2.shared.messages.agent.llm_response_hook import capture_llm_response as _capture"
    severity: WARNING
    message: "SSOT violation: import duplication across files — consider centralizing in __init__.py"

  - id: DRY-deprecated-reference
    patterns:
      - pattern: "DEPRECATED"
    severity: INFO
    message: "DRY note: deprecated code reference found"

  - id: SSOT-duplicate-constant-def
    patterns:
      - pattern: "$X = \"$Y\""
    severity: INFO
    message: "Potential SSOT violation: constant definition — check if already defined elsewhere in domain models"
