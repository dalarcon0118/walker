# ruff configuration for magic-value-comparison detection.
#
# Used by qlty (via .qlty/qlty.toml -> config_files).
# PLR2004 flags hardcoded string and number literals in comparisons
# that should be named constants.
#
# Docs: https://docs.astral.sh/ruff/rules/magic-value-comparison/
[lint]
select = ["PLR2004"]

# Empty array = no types are whitelisted.
# By default Ruff excludes strings from PLR2004; setting this to empty
# forces Ruff to also flag inline string comparisons as magic values.
[lint.pylint]
allow-magic-value-types = []
